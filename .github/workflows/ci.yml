name: Qalqan checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qalqan
          POSTGRES_USER: qalqan
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qalqan -d qalqan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m ai.evaluate
      - run: python -m tests.postgres_smoke
        env:
          TEST_DATABASE_URL: postgresql://qalqan:ci-only-password@localhost:5432/qalqan
      - run: node --check frontend/app.js
      - run: docker build -t qalqan-ci .
