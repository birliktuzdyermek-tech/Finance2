name: Qalqan checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qalqan
          POSTGRES_USER: qalqan
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qalqan -d qalqan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: node --test tests/local_analyzer.test.cjs
      - run: python -m unittest discover -s tests -v
      - run: python -m ai.evaluate
      - run: python -m tests.postgres_smoke
        env:
          TEST_DATABASE_URL: postgresql://qalqan:ci-only-password@localhost:5432/qalqan
      - run: node --check frontend/app.js
      - run: node --check frontend/analyzer.js && node --check frontend/i18n.js && node --check frontend/local-store.js
      - run: pip install -r tests/requirements.txt && python -m playwright install --with-deps chromium
      - name: Browser privacy and interaction regressions
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/qalqan-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 40 http://127.0.0.1:8000/api/health
          python -m tests.browser_smoke
          python -m tests.design_browser_smoke
          python -m tests.auth_browser_smoke
      - run: docker build -t qalqan-ci .
