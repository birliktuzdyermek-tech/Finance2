# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free demo resources; review free Postgres expiry before a competition final.
services:
  - type: web
    name: qalqan-finance-security
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DATABASE_URL
        fromDatabase:
          name: qalqan-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: RATE_LIMIT
        value: "30"
databases:
  - name: qalqan-db
    databaseName: qalqan
    user: qalqan
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
